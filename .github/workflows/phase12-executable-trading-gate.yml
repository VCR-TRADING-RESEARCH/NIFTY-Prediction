name: Phase 12 — Executable Trading and Cost Gate

on:
  push:
    branches: [research/phase-12-executable-trading-gate]
    paths: [".github/workflows/phase12-executable-trading-gate.yml", "scripts/phase12_cost_gate.py", "tests/test_phase12_cost_gate.py", "docs/PHASE_12_EXECUTABLE_TRADING_GATE.md", "research/data/phase12_contract_fills.csv"]
  pull_request:
    branches: [research/phase-11-diverse-model-benchmark]
    paths: [".github/workflows/phase12-executable-trading-gate.yml", "scripts/phase12_cost_gate.py", "tests/test_phase12_cost_gate.py", "docs/PHASE_12_EXECUTABLE_TRADING_GATE.md", "research/data/phase12_contract_fills.csv"]
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: phase12-cost-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cost-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run repository tests
        run: python -m pytest -q tests
      - name: Run fail-closed cost gate
        run: python scripts/phase12_cost_gate.py
      - name: Upload cost-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-cost-gate-${{ github.run_id }}
          path: research/results/phase12/cost_gate_report.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist gate report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/phase12/cost_gate_report.json
          git commit -m "Record Phase 12 executable trading gate [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
