name: On-demand NIFTY ExtraTrees prediction

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "10:00 IST anchor date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: nifty-prediction-${{ github.event.issue.number || inputs.as_of_date || github.run_id }}
  cancel-in-progress: false

jobs:
  predict:
    # Only repository owners/members can start a job that receives Dhan secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER') &&
       startsWith(github.event.issue.title, '[NIFTY PREDICT] '))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate request title
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_DATE: ${{ inputs.as_of_date }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import date
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              value = os.environ["INPUT_DATE"].strip()
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", value):
                  raise SystemExit("Date must use YYYY-MM-DD.")
          else:
              match = re.fullmatch(r"\[NIFTY PREDICT\] (\d{4}-\d{2}-\d{2})", os.environ["ISSUE_TITLE"])
              if not match:
                  raise SystemExit("Invalid title. Expected [NIFTY PREDICT] YYYY-MM-DD.")
              value = match.group(1)
          date.fromisoformat(value)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("as_of_date=" + value + "\n")
          PY

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Dhan minute-data cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nifty-dhan-cache
          key: nifty-dhan-minute-v1-${{ runner.os }}-${{ steps.request.outputs.as_of_date }}-${{ github.run_id }}
          restore-keys: |
            nifty-dhan-minute-v1-${{ runner.os }}-

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Dhan-backed ExtraTrees inference
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_CACHE_DIR: ${{ runner.temp }}/nifty-dhan-cache
          NIFTY_AS_OF_DATE: ${{ steps.request.outputs.as_of_date }}
          NIFTY_REQUEST_ISSUE: ${{ github.event.issue.number }}
          NIFTY_REQUEST_STARTED_AT: ${{ github.event.issue.created_at }}
        run: python scripts/run_live_prediction.py

      - name: Save refreshed Dhan minute-data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nifty-dhan-cache
          key: nifty-dhan-minute-v1-${{ runner.os }}-${{ steps.request.outputs.as_of_date }}-${{ github.run_id }}

      - name: Publish result to GitHub Pages
        if: always()
        env:
          REQUEST_DATE: ${{ steps.request.outputs.as_of_date }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$REQUEST_DATE" ]; then
            echo "No valid request date; refusing to publish a result."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/assets/predictions/$REQUEST_DATE.json"
          if git diff --cached --quiet; then
            echo "Prediction output missing; nothing to publish."
            exit 1
          fi
          git commit -m "Publish ExtraTrees prediction for $REQUEST_DATE (request #$ISSUE_NUMBER)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Report completion on request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUEST_DATE: ${{ steps.request.outputs.as_of_date }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Prediction workflow finished for $REQUEST_DATE. View sanitized diagnostics: $RUN_URL. The result appears on the prediction page after Pages updates; failed data/model checks are reported as failures and never replaced by an old forecast."
