name: Validate Live Dhan API

on:
  push:
    branches:
      - "phase/**"
    paths:
      - "live_api/**"
      - "scripts/deploy_live_api_space.py"
      - "scripts/research_core.py"
      - "tests/test_live_api.py"
      - "docs/assets/predictor.js"
      - "docs/assets/live-api-config.json"
      - "requirements.txt"
      - ".github/workflows/test-live-api.yml"
      - ".github/workflows/free-pages-prediction.yml"
  pull_request:
    branches:
      - main
    paths:
      - "live_api/**"
      - "scripts/deploy_live_api_space.py"
      - "scripts/research_core.py"
      - "tests/test_live_api.py"
      - "requirements.txt"
      - ".github/workflows/test-live-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test live API validation logic
        run: python -m pytest -q tests/test_live_api.py tests/test_research_core.py
      - name: Check browser JavaScript syntax
        run: node --check docs/assets/predictor.js
      - name: Validate public endpoint configuration JSON
        run: python -m json.tool docs/assets/live-api-config.json > /dev/null
