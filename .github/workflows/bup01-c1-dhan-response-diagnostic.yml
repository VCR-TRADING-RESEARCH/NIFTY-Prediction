name: BUP-01 C1 Dhan response-shape diagnostic

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/probe_c1_dhan_intraday_response_shape.py"
      - "tests/test_c1_dhan_response_shape_probe.py"
      - ".github/workflows/bup01-c1-dhan-response-diagnostic.yml"
  pull_request:
    branches:
      - phase/constituent-weekly-outcomes-c0
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bup01-c1-market-data-${{ github.repository }}
  cancel-in-progress: false

jobs:
  response-diagnostic:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout C1 data branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and live API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt pytest
      - name: Validate response-shape sanitization offline
        run: python -m pytest -q tests/test_c1_dhan_response_shape_probe.py
      - name: Run bounded Dhan response-shape probe
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/constituent_weekly/probe_c1_dhan_intraday_response_shape.py
      - name: Upload sanitized Dhan response diagnostic
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: c1-dhan-response-shape-${{ github.run_id }}
          path: research/constituent_weekly/C1_DHAN_INTRADAY_RESPONSE_DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish diagnostic from current branch with retry
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_file="research/constituent_weekly/C1_DHAN_INTRADAY_RESPONSE_DIAGNOSTIC.json"
          if [ ! -s "$source_file" ]; then
            echo "No response-shape diagnostic file was created."
            exit 1
          fi
          cp "$source_file" "$RUNNER_TEMP/C1_DHAN_INTRADAY_RESPONSE_DIAGNOSTIC.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin phase/constituent-weekly-outcomes-c1-data
            git reset --hard origin/phase/constituent-weekly-outcomes-c1-data
            mkdir -p research/constituent_weekly
            cp "$RUNNER_TEMP/C1_DHAN_INTRADAY_RESPONSE_DIAGNOSTIC.json" "$source_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$source_file"
            if ! git diff --cached --quiet; then
              git commit -m "Record sanitized C1 Dhan response-shape diagnostic"
              if git push origin HEAD:phase/constituent-weekly-outcomes-c1-data; then
                echo "Diagnostic published."
                exit 0
              fi
            else
              echo "Diagnostic already current."
              exit 0
            fi
            sleep 2
          done
          echo "Unable to publish diagnostic after five non-forced attempts."
          exit 1
      - name: Print sanitized diagnostic summary
        if: always() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/constituent_weekly/C1_DHAN_INTRADAY_RESPONSE_DIAGNOSTIC.json")
          if not path.exists():
              print("Diagnostic JSON missing.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          print("DIAGNOSTIC_STATUS", data.get("status"))
          for item in data.get("cases", []):
              print(
                  "CASE", item.get("case"),
                  "HTTP", item.get("http_status"),
                  "JSON", item.get("json_status"),
                  "TOP_KEYS", item.get("top_level_keys"),
                  "DATA_TYPE", item.get("data_field_type"),
                  "DATA_KEYS", item.get("data_keys"),
                  "MESSAGE_CLASS", item.get("provider_message_category"),
              )
          PY
