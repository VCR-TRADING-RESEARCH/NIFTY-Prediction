name: BUP-01 C1 Dhan daily OHLCV feature coverage

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/audit_c1_daily_history.py"
      - "scripts/constituent_weekly/update_c1_daily_status.py"
      - "tests/test_c1_daily_history.py"
      - "data/constituent_weekly/nifty50_membership_intervals.csv"
      - "data/reconciliation/nifty50_official_daily.csv"
  pull_request:
    branches:
      - phase/constituent-weekly-outcomes-c0
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bup01-c1-market-data-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.workflow || 'push' }}
  cancel-in-progress: false

jobs:
  daily-feature-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout C1 data branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and live API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt pytest cryptography huggingface_hub pyarrow
      - name: Validate daily coverage logic offline
        run: python -m pytest -q tests/test_c1_daily_history.py
      - name: Restore encrypted TejHQ personal-use cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.ref_name }}
      - name: Run one-request-per-security Dhan daily coverage audit
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEJHQ_ENCRYPTED_CACHE_DIR: ~/.cache/bup01-tejhq-encrypted
          TEJHQ_PERSONAL_USE_ONLY: "1"
        run: python scripts/constituent_weekly/audit_c1_daily_history.py
      - name: Save encrypted TejHQ personal-use cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.ref_name }}
      - name: Generate sanitized daily report for artifact retention
        if: always() && github.event_name != 'pull_request'
        run: python scripts/constituent_weekly/update_c1_daily_status.py
      - name: Upload sanitized daily coverage artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: c1-daily-ohlcv-coverage-${{ github.run_id }}
          path: |
            research/constituent_weekly/C1_DAILY_COVERAGE.json
            research/constituent_weekly/C1_DAILY_COVERAGE_REPORT.md
          if-no-files-found: warn
          retention-days: 90
      - name: Publish daily status from latest branch safely
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_json="research/constituent_weekly/C1_DAILY_COVERAGE.json"
          if [ ! -s "$source_json" ]; then
            echo "No sanitized daily coverage JSON was created."
            exit 1
          fi
          cp "$source_json" "$RUNNER_TEMP/C1_DAILY_COVERAGE.json"
          for attempt in 1 2 3 4 5; do
            echo "Daily coverage publish attempt $attempt of 5"
            git fetch origin phase/constituent-weekly-outcomes-c1-data
            git reset --hard origin/phase/constituent-weekly-outcomes-c1-data
            cp "$RUNNER_TEMP/C1_DAILY_COVERAGE.json" "$source_json"
            python scripts/constituent_weekly/update_c1_daily_status.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$source_json"
            git add -f research/constituent_weekly/C1_DAILY_COVERAGE_REPORT.md
            git add -f research/constituent_weekly/STATUS.md
            git add -f logs/RESEARCH_LOG.md logs/ERROR_LOG.md 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No new daily coverage content to publish."
              exit 0
            fi
            git commit -m "Record C1 daily OHLCV feature coverage audit"
            if git push origin HEAD:phase/constituent-weekly-outcomes-c1-data; then
              echo "Daily coverage result committed."
              exit 0
            fi
            echo "Concurrent update; reset and regenerate the daily report."
            sleep 2
          done
          echo "Could not publish daily coverage results after five non-forced attempts."
          exit 1
      - name: Show daily coverage result
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f research/constituent_weekly/C1_DAILY_COVERAGE_REPORT.md ]; then
            cat research/constituent_weekly/C1_DAILY_COVERAGE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Daily coverage is descriptive; no unregistered percentage threshold is added and C2 remains gated." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail only for execution/auth blockers
        if: always() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/constituent_weekly/C1_DAILY_COVERAGE.json")
          if not path.is_file():
              raise SystemExit("DAILY_COVERAGE_REPORT_MISSING")
          data = json.loads(path.read_text(encoding="utf-8"))
          status = data.get("status")
          print("DAILY_COVERAGE_STATUS", status)
          if status in ("BLOCKED_AUTH_OR_ENTITLEMENT", "PARTIAL_OR_BLOCKED_RUNTIME_ERROR"):
              raise SystemExit("Daily coverage could not complete; see sanitized error log.")
          print("Daily coverage evidence recorded; gaps are descriptive, not a new registered gate.")
          PY
