name: BUP-01 C2 constituent panel and walk-forward models

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c2-panel
    paths:
      - "scripts/constituent_weekly/run_c2_panel_and_models.py"
      - "scripts/constituent_weekly/publish_c2_run.py"
      - "tests/test_c2_panel_and_models.py"
      - ".github/workflows/bup01-c2-constituent-panel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bup01-c2-models-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  constituent-panel-and-models:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout C2 branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c2-panel
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            live_api/requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt "cryptography>=42"

      - name: Compile C2 runner and publisher
        run: python -m py_compile scripts/constituent_weekly/run_c2_panel_and_models.py scripts/constituent_weekly/publish_c2_run.py

      - name: Clear stale C2 result snapshots
        run: |
          rm -f research/constituent_weekly/C2_MODEL_RESULTS.json
          rm -f research/constituent_weekly/C2_MODEL_RESULTS.md
          rm -f research/constituent_weekly/C2_INDEX_OOF_FORECASTS.csv
          rm -f research/constituent_weekly/C2_STOCK_OOF_FORECASTS.csv
          rm -f research/constituent_weekly/C2_CYCLE_FEATURE_SUMMARIES.csv

      - name: Run C2 offline regression tests
        id: offline
        run: python -m pytest -q tests/test_c2_panel_and_models.py

      - name: Prepare encrypted cache directory
        run: mkdir -p ${{ runner.temp }}/bup01-tejhq-encrypted

      - name: Restore encrypted C2 data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-c2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bup01-c2-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build constituent panel and run walk-forward models
        id: c2
        if: steps.offline.outcome == 'success'
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEJHQ_PERSONAL_USE_ONLY: "1"
          BUP01_ENCRYPTED_CACHE_DIR: ${{ runner.temp }}/bup01-tejhq-encrypted
        run: python scripts/constituent_weekly/run_c2_panel_and_models.py

      - name: Detect encrypted cache contents
        if: always()
        id: cache_state
        shell: bash
        run: |
          if find "${{ runner.temp }}/bup01-tejhq-encrypted" -type f -name '*.aesgcm' -print -quit | grep -q .; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save encrypted C2 data cache
        if: always() && steps.cache_state.outputs.has_files == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-c2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload sanitized C2 reports and forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bup01-c2-results-${{ github.run_id }}
          path: |
            research/constituent_weekly/C2_MODEL_RESULTS.json
            research/constituent_weekly/C2_MODEL_RESULTS.md
            research/constituent_weekly/C2_INDEX_OOF_FORECASTS.csv
            research/constituent_weekly/C2_STOCK_OOF_FORECASTS.csv
            research/constituent_weekly/C2_CYCLE_FEATURE_SUMMARIES.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Publish results with concurrency-safe branch retries
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          C2_TEST_OUTCOME: ${{ steps.offline.outcome }}
          C2_MODEL_OUTCOME: ${{ steps.c2.outcome }}
        run: python scripts/constituent_weekly/publish_c2_run.py

      - name: Enforce C2 exploratory result gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/constituent_weekly/C2_MODEL_RESULTS.json")
          if not path.exists():
              raise SystemExit("C2 failed: no sanitized model result JSON.")
          result = json.loads(path.read_text())
          if result.get("status") != "COMPLETED_EXPLORATORY":
              raise SystemExit(f"C2 failed: {result.get('status')} ({result.get('fatal_error_category', 'no category')}).")
          panel = result.get("panel", {})
          if panel.get("meta_oof_cycles", 0) <= 0 or panel.get("stock_oof_cycles", 0) <= 0:
              raise SystemExit("C2 failed: no walk-forward forecasts.")
          print("C2 exploratory panel and models completed.")
          PY
