name: BUP-01 C1 amcs.fund source metadata discovery

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/probe_amcs_fund_metadata.py"
      - "tests/test_amcs_fund_metadata.py"
      - ".github/workflows/bup01-c1-amcs-metadata-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bup01-c1-amcs-metadata-discovery
  cancel-in-progress: false

jobs:
  metadata-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest
      - name: Run offline metadata-sanitisation tests
        run: python -m pytest -q tests/test_amcs_fund_metadata.py
      - name: Probe API metadata and original-source links
        run: python scripts/constituent_weekly/probe_amcs_fund_metadata.py
      - name: Publish metadata-only report to job summary
        if: always()
        run: |
          if [ -f research/constituent_weekly/C1_AMCS_API_DISCOVERY_REPORT.md ]; then
            cat research/constituent_weekly/C1_AMCS_API_DISCOVERY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit sanitised metadata report with bounded retry
        if: always()
        run: |
          target_branch="phase/constituent-weekly-outcomes-c1-data"
          report="research/constituent_weekly/C1_AMCS_API_DISCOVERY_REPORT.md"
          if [ -f "$report" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$report"
            if ! git diff --cached --quiet; then
              git commit -m "Record amcs.fund metadata source discovery"
              for attempt in 1 2 3 4 5; do
                git fetch origin "$target_branch"
                git rebase "origin/$target_branch"
                if git push origin "HEAD:$target_branch"; then
                  exit 0
                fi
                echo "Concurrent branch update during publish attempt $attempt; retrying."
                git rebase --abort || true
                sleep 2
              done
              echo "Could not publish metadata report after five non-forced attempts."
              exit 1
            fi
          fi
