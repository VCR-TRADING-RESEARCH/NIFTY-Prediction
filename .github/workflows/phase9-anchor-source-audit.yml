name: Phase 9 — Historical Anchor Source Audit

on:
  push:
    branches:
      - research/phase-9-anchor-source-audit
    paths:
      - ".github/workflows/phase9-anchor-source-audit.yml"
      - "scripts/compare_anchor_sources.py"
      - "scripts/fetch_data.py"
      - "scripts/research_core.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase9-anchor-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Restore cached minute archives
        uses: actions/cache@v4
        with:
          path: |
            data/raw/nifty50
            data/cache/alternative-minute
          key: nifty-anchor-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nifty-anchor-audit-${{ runner.os }}-
      - name: Fetch or reuse primary minute archive
        run: python scripts/fetch_data.py
      - name: Compare historical 10:00 anchors
        id: audit
        run: python scripts/compare_anchor_sources.py
      - name: Upload anchor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-anchor-audit-${{ github.run_id }}
          path: |
            data/reconciliation/anchor_source_comparison.csv
            data/reconciliation/anchor_source_comparison_report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit compact comparison report and logs
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          report=Path("data/reconciliation/anchor_source_comparison_report.json")
          if report.exists():
              obj=json.loads(report.read_text())
              entry=(f"\n\n## Phase 9 historical anchor source audit — run {__import__('os').getenv('GITHUB_RUN_ID','local')} — {datetime.now(timezone.utc).isoformat()}\n"
                     f"- Status: {obj.get('status')} (diagnostic only).\n"
                     f"- Counts: {json.dumps(obj.get('counts',{}),sort_keys=True)}.\n"
                     f"- Difference summary: {json.dumps(obj.get('absolute_difference_points',{}),sort_keys=True)}.\n"
                     "- Caveat: secondary archive provider lineage is unverified; this comparison cannot pass the official independent-anchor gate.\n"
                     "- Output: data/reconciliation/anchor_source_comparison.csv and anchor_source_comparison_report.json.\n")
              with Path("logs/RESEARCH_LOG.md").open("a") as f: f.write(entry)
              if obj.get("counts",{}).get("anchor_open_mismatches_over_1_point",0)>0:
                  with Path("logs/ERROR_LOG.md").open("a") as f: f.write(entry)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reconciliation/anchor_source_comparison.csv data/reconciliation/anchor_source_comparison_report.json logs/RESEARCH_LOG.md logs/ERROR_LOG.md
          if git diff --cached --quiet; then echo "No report to commit"; else
            git commit -m "Record Phase 9 historical anchor source audit [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
