name: Dhan NIFTY expired-options collection
on:
  pull_request:
    paths:
      - "scripts/fetch_dhan_expired_options.py"
      - "scripts/refresh_dhan_token.py"
      - "scripts/smoke_test_dhan_options.py"
      - ".github/workflows/dhan-options-collection.yml"
  workflow_dispatch:
    inputs:
      from_date:
        description: Start date (YYYY-MM-DD; max five years)
        required: false
        type: string
      to_date:
        description: End date exclusive (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: "25 18 2 * *"
permissions:
  contents: read
concurrency:
  group: dhan-nifty-options-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install --upgrade pandas pyarrow requests pyotp
      - name: Restore Dhan options cache
        uses: actions/cache@v4
        with:
          path: .cache/dhan-options
          key: dhan-nifty-options-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dhan-nifty-options-v1-${{ runner.os }}-
      - name: Generate short-lived Dhan access token
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/refresh_dhan_token.py
      - name: Verify Dhan expired-options endpoint
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
        run: python scripts/smoke_test_dhan_options.py
      - name: Collect five-year rolling NIFTY options
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_FROM_DATE: ${{ inputs.from_date }}
          DHAN_TO_DATE: ${{ inputs.to_date }}
          DHAN_OPTIONS_CACHE: .cache/dhan-options
          DHAN_REQUEST_PAUSE: "0.25"
        run: python scripts/fetch_dhan_expired_options.py
      - name: Upload manifest and data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhan-nifty-options-manifest
          path: .cache/dhan-options/manifest.json
          if-no-files-found: ignore
