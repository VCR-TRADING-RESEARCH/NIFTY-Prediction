name: Phase 10 — Dhan Verified Dataset and Bounded Method Test

on:
  push:
    branches:
      - research/phase-10-verified-dataset-rebuild
    paths:
      - ".github/workflows/phase10-dhan-verified-dataset.yml"
      - "scripts/fetch_dhan_anchor_history.py"
      - "scripts/rebuild_dhan_verified_dataset.py"
      - "tests/test_phase10_verified_dataset.py"
      - "docs/PHASE_10_VERIFIED_DATASET.md"
      - "docs/RESEARCH_PLAN.md"
      - "docs/RESEARCH_PLAN_V1_2_DHAN_DATASET_ADDENDUM.md"
      - "docs/DATA_SOURCES.md"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Force refresh of all cached Dhan minute-history chunks
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: phase10-verified-dataset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
      FORCE_REFRESH_DHAN_ANCHORS: ${{ inputs.force_refresh }}
    steps:
      - name: Checkout Phase 10 branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore Dhan historical cache
        uses: actions/cache@v4
        with:
          path: data/cache/dhan-anchors
          key: nifty-dhan-anchor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nifty-dhan-anchor-${{ runner.os }}-

      - name: Remove prior Phase 10 outputs to prevent stale reuse
        run: |
          rm -rf research/results/phase10
          rm -f data/processed/dhan_history_manifest.json
          rm -f data/processed/phase10_dhan_weekly_labels_features.csv
          rm -f data/processed/phase10_expiry_calendar_used.csv
          rm -f data/processed/phase10_excluded_cycle_candidates.csv

      - name: Run full repository and Phase 10 source-gate tests
        id: tests
        run: python -m pytest -q tests

      - name: Prepare or refresh authenticated Dhan history
        id: fetch
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/fetch_dhan_anchor_history.py

      - name: Rebuild targets with official NSE OHLC and run the fixed candidate evaluation
        id: rebuild
        run: python scripts/rebuild_dhan_verified_dataset.py

      - name: Upload compact Phase 10 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-dhan-verified-research-${{ github.run_id }}
          path: |
            data/processed/dhan_history_manifest.json
            data/processed/phase10_dhan_weekly_labels_features.csv
            data/processed/phase10_expiry_calendar_used.csv
            data/processed/phase10_excluded_cycle_candidates.csv
            research/results/phase10/**
            README.md
            research/manuscript.md
            logs/RESEARCH_LOG.md
            logs/ERROR_LOG.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Record phase outcome and persist report, README and logs
        if: always() && steps.checkout.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          run=os.getenv("GITHUB_RUN_ID","local")
          stamp=datetime.now(timezone.utc).isoformat()
          summary_path=Path("research/results/phase10/summary.json")
          data_quality_path=Path("research/results/phase10/data_quality_report.json")
          failure_path=Path("research/results/phase10/failure_report.json")
          readme=Path("README.md")
          manuscript=Path("research/manuscript.md")
          research_log=Path("logs/RESEARCH_LOG.md")
          error_log=Path("logs/ERROR_LOG.md")
          status="BLOCKED_WORKFLOW_FAILURE"
          note=""
          if summary_path.exists():
              data=json.loads(summary_path.read_text())
              status=data.get("model_result_status","RESULT_REPORTED")
              note=(f"- Dataset status: {data.get('dataset_status')}.\n"
                    f"- Model result: {data.get('model_result_status')}.\n"
                    f"- Source-gated cycles: {data.get('weekly_cycles_built')}; binary rows: {data.get('binary_rows')}; "
                    f"development/holdout: {data.get('development_rows')}/{data.get('holdout_rows')}.\n"
                    f"- Baseline/challenger selected on development: {data.get('selected_baseline')} / {data.get('selected_augmented_candidate')}.\n"
                    f"- Screening details: {json.dumps(data.get('screening',{}),sort_keys=True)}.\n"
                    "- Trading strategy: NOT VALIDATED; no contract-level cost-adjusted futures/options P&L was run.\n")
          elif failure_path.exists():
              data=json.loads(failure_path.read_text())
              status=data.get("status","BLOCKED_REBUILD_ERROR")
              note=(f"- Failure status: {status}.\n"
                    f"- Sanitized error: {data.get('error_type')}: {data.get('error')}.\n"
                    "- No model acceptance or current prediction is implied.\n")
          else:
              note="- No fresh Phase 10 summary or failure report was produced; inspect the exact failed Actions step.\n"

          entry=(f"\n\n## Phase 10 automated run {run} — {stamp}\n"
                 f"- Workflow outcomes: tests={os.getenv('TEST_OUTCOME')}, Dhan history={os.getenv('FETCH_OUTCOME')}, "
                 f"rebuild/evaluation={os.getenv('REBUILD_OUTCOME')}.\n"
                 f"- Final status: {status}.\n"
                 + note +
                 "- Plan: docs/PHASE_10_VERIFIED_DATASET.md and docs/RESEARCH_PLAN_V1_2_DHAN_DATASET_ADDENDUM.md.\n"
                 "- Raw Dhan history remains cache-only; only compact metadata and derived results are committed.\n")
          research_log.parent.mkdir(parents=True,exist_ok=True)
          with research_log.open("a",encoding="utf-8") as f: f.write(entry)
          if any(os.getenv(k) != "success" for k in ("TEST_OUTCOME","FETCH_OUTCOME","REBUILD_OUTCOME")):
              with error_log.open("a",encoding="utf-8") as f:
                  f.write(entry+"- Review the failed test/data/rebuild step, preserve the error record, add a regression test and retry once.\n")

          if not summary_path.exists():
              start="<!-- PHASE10_STATUS_START -->"
              end="<!-- PHASE10_STATUS_END -->"
              block=(f"{start}\n## Phase 10 — Dhan-backed dataset rebuild\n"
                     f"- **Status:** {status}; no successful rebuilt model report is available for this run.\n"
                     "- Check [workflow](https://github.com/VCR-TRADING-RESEARCH/NIFTY-Prediction/actions) and the [Phase 10 plan](docs/PHASE_10_VERIFIED_DATASET.md).\n"
                     "- No stale result is reused and no trading strategy is validated.\n"
                     f"{end}")
              txt=readme.read_text(encoding="utf-8")
              if start in txt and end in txt:
                  before=txt.split(start)[0]
                  after=txt.split(end,1)[1]
                  txt=before+block+after
              else:
                  txt=txt.rstrip()+"\n\n"+block+"\n"
              readme.write_text(txt,encoding="utf-8")

              mstart="<!-- PHASE10_RESULTS_START -->"
              mend="<!-- PHASE10_RESULTS_END -->"
              mblock=(f"{mstart}\n## Phase 10 execution status\n\n"
                      f"**Status:** {status}. The automated Dhan-backed rebuild did not produce a successful summary in run {run}. "
                      "This is a blocked execution result, not model performance evidence. See logs/ERROR_LOG.md and "
                      "docs/PHASE_10_VERIFIED_DATASET.md.\n"
                      f"{mend}")
              mt=manuscript.read_text(encoding="utf-8")
              if mstart in mt and mend in mt:
                  before=mt.split(mstart)[0]
                  after=mt.split(mend,1)[1]
                  mt=before+mblock+after
              else:
                  mt=mt.rstrip()+"\n\n"+mblock+"\n"
              manuscript.write_text(mt,encoding="utf-8")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in README.md research/manuscript.md logs/RESEARCH_LOG.md logs/ERROR_LOG.md data/processed/dhan_history_manifest.json data/processed/phase10_dhan_weekly_labels_features.csv data/processed/phase10_expiry_calendar_used.csv data/processed/phase10_excluded_cycle_candidates.csv research/results/phase10; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated report/log changes to commit."
          else
            git commit -m "Record Phase 10 Dhan-backed dataset and bounded evaluation [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          PY
