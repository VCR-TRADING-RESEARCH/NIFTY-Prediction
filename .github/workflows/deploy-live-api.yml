name: Deploy Live Dhan ExtraTrees API

on:
  push:
    branches:
      - main
    paths:
      - "live_api/**"
      - "scripts/deploy_live_api_space.py"
      - "scripts/research_core.py"
      - "data/reconciliation/nifty50_official_daily.csv"
      - "data/reconciliation/expiry_verification.csv"
      - "tests/test_live_api.py"
      - ".github/workflows/deploy-live-api.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-live-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deployment and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "huggingface_hub>=0.27"

      - name: Validate live API logic
        run: python -m pytest -q tests/test_live_api.py tests/test_research_core.py

      - name: Deploy Docker Space and install runtime secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/deploy_live_api_space.py

      - name: Publish API endpoint configuration to Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/live-api-config.json
          if git diff --cached --quiet; then
            echo "Live API endpoint configuration is unchanged."
          else
            git commit -m "Publish live Dhan inference endpoint"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
