name: BUP-01 C1 authorised-source audit

on:
  push:
    branches:
      - "phase/constituent-weekly-outcomes-c1-data"
    paths:
      - "research/constituent_weekly/**"
      - "scripts/constituent_weekly/**"
      - "tests/test_constituent_weekly_source_fetch.py"
      - ".github/workflows/constituent-weekly-c1-data.yml"
  pull_request:
    branches:
      - "phase/constituent-weekly-outcomes-c0"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline source-audit tests
        run: python -m unittest discover -s tests -p "test_constituent_weekly_source_fetch.py" -v
      - name: Inspect separately authorised local archives only
        run: python scripts/constituent_weekly/fetch_official_weight_report.py --input-dir data/authorized/constituent_weekly
      - name: Update C1 phase status
        if: always()
        run: python scripts/constituent_weekly/update_c1_status.py
      - name: Commit compact audit evidence only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/constituent_weekly/C1_OFFICIAL_WEIGHT_MANIFEST.json research/constituent_weekly/C1_SOURCE_FETCH_REPORT.md research/constituent_weekly/STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record BUP-01 C1 authorised-source audit"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
