name: BUP-01 C1 official source feasibility audit

on:
  push:
    branches:
      - "phase/constituent-weekly-outcomes-c1-data"
    paths:
      - "research/constituent_weekly/**"
      - "scripts/constituent_weekly/**"
      - "tests/test_constituent_weekly_source_fetch.py"
      - ".github/workflows/constituent-weekly-c1-data.yml"
  pull_request:
    branches:
      - "phase/constituent-weekly-outcomes-c0"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  official-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore official report cache
        uses: actions/cache@v4
        with:
          path: data/cache/constituent_weekly/official
          key: bup01-official-weight-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bup01-official-weight-${{ runner.os }}-
      - name: Run source-fetch unit tests
        run: python -m unittest discover -s tests -p "test_constituent_weekly_source_fetch.py" -v
      - name: Fetch and inventory official monthly reports
        run: python scripts/constituent_weekly/fetch_official_weight_report.py
      - name: Update C1 phase status
        if: always()
        run: python scripts/constituent_weekly/update_c1_status.py
      - name: Upload official source audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bup01-c1-official-weight-audit-${{ github.run_number }}
          path: |
            research/constituent_weekly/C1_OFFICIAL_WEIGHT_MANIFEST.json
            research/constituent_weekly/C1_SOURCE_FETCH_REPORT.md
            data/cache/constituent_weekly/official/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit compact source audit and phase status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/constituent_weekly/
          if ! git diff --cached --quiet; then
            git commit -m "Record BUP-01 C1 official source audit"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
