name: BUP-01 Nippon AMC offline parser tests (bulk retrieval paused)

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/probe_nippon_amc_archive.py"
      - "tests/test_nippon_amc_archive_probe.py"
      - ".github/workflows/bup01-c1-amc-disclosure-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bup01-c1-amc-disclosure-probe
  cancel-in-progress: false

jobs:
  probe-primary-amc-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout C1 branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata-probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas xlrd openpyxl pytest
      - name: Run offline parser regressions
        run: python -m pytest -q tests/test_nippon_amc_archive_probe.py
      - name: Record v1.3 source-use restriction
        run: echo "Bulk AMC workbook downloads are paused. This workflow runs offline parser tests only; no network source collection is performed." >> "$GITHUB_STEP_SUMMARY"
