name: BUP-01 C1 Dhan corporate-action adjustment diagnostic

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/audit_c1_dhan_adjustments.py"
      - "tests/test_c1_dhan_adjustments.py"
      - "scripts/constituent_weekly/audit_c1_intraday_ca_diagnostic.py"
      - "tests/test_c1_intraday_ca_diagnostic.py"
      - ".github/workflows/bup01-c1-dhan-adjustments.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bup01-c1-market-data-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.workflow || 'push' }}
  cancel-in-progress: false

jobs:
  dhan-bonus-adjustment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout C1 data branch
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt pytest cryptography huggingface_hub pyarrow
      - name: Run offline factor-math tests
        run: python -m pytest -q tests/test_c1_dhan_adjustments.py tests/test_c1_intraday_ca_diagnostic.py tests/test_c1_intraday_ca_diagnostic.py
      - name: Restore encrypted TejHQ personal-use cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.run_id }}
          restore-keys: |
            bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-
      - name: Run Dhan adjusted-price diagnostic
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEJHQ_ENCRYPTED_CACHE_DIR: ${{ runner.temp }}/bup01-tejhq-encrypted
          TEJHQ_PERSONAL_USE_ONLY: "1"
        run: python scripts/constituent_weekly/audit_c1_dhan_adjustments.py
      - name: Run Dhan intraday corporate-action scale diagnostic
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: python scripts/constituent_weekly/audit_c1_intraday_ca_diagnostic.py
      - name: Save encrypted TejHQ personal-use cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.run_id }}
      - name: Upload sanitised adjustment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-dhan-adjustment-diagnostic-${{ github.run_id }}
          path: |
            research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.json
            research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.md
            research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.json
            research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.md
          if-no-files-found: warn
          retention-days: 90
      - name: Publish sanitised report to C1 branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c1-dhan-publish"
          for file in research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.json research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.md research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.json research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.md; do
            if [[ -f "$file" ]]; then cp "$file" "$RUNNER_TEMP/c1-dhan-publish/$(basename "$file")"; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin phase/constituent-weekly-outcomes-c1-data
            git reset --hard origin/phase/constituent-weekly-outcomes-c1-data
            for file in research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.json research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.md research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.json research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.md; do
              saved="$RUNNER_TEMP/c1-dhan-publish/$(basename "$file")"
              if [[ -f "$saved" ]]; then cp "$saved" "$file"; fi
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.json
            git add -f research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.md
            git add -f research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.json
            git add -f research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.md
            if git diff --cached --quiet; then echo "No diagnostic report change."; exit 0; fi
            git commit -m "Record Dhan corporate-action adjustment diagnostic"
            if git push origin HEAD:phase/constituent-weekly-outcomes-c1-data; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce registered adjustment diagnostic gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research/constituent_weekly/C1_DHAN_ADJUSTMENT_DIAGNOSTIC.json')
          result = json.loads(path.read_text())
          print('C1_DHAN_ADJUSTMENT_STATUS', result.get('status'))
          if result.get('status') != 'PASS_ALL_EVENT_ADJUSTMENTS' or len(result.get('events', [])) != 2:
              raise SystemExit(1)
          if any(item.get('status') != 'PASS_ADJUSTMENT_FACTOR' for item in result['events']):
              raise SystemExit(1)
          PY
      - name: Enforce intraday diagnostic completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/constituent_weekly/C1_DHAN_INTRADAY_CA_DIAGNOSTIC.json').read_text())
          allowed = {'RAW_SCALE_UNADJUSTED_INTRADAY', 'ADJUSTED_SCALE_INTRADAY'}
          statuses = [item.get('diagnostic', {}).get('status') for item in result.get('events', [])]
          print('C1_DHAN_INTRADAY_CA_STATUS', result.get('status'), statuses)
          if result.get('status') != 'COMPLETED_INTRADAY_SCALE_DIAGNOSTIC' or len(statuses) != 2:
              raise SystemExit(1)
          if any(s not in allowed for s in statuses):
              raise SystemExit(1)
          PY
