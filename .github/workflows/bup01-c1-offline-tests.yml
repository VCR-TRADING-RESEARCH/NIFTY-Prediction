name: BUP-01 C1 offline data and auth regression tests

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/dhan_auth.py"
      - "scripts/refresh_dhan_token.py"
      - "scripts/constituent_weekly/dhan_equity_preflight.py"
      - "scripts/constituent_weekly/diagnose_shreecem_edge_volume.py"
      - "scripts/constituent_weekly/iwf_math.py"
      - "tests/test_dhan_token_refresh_script.py"
      - "tests/test_constituent_weekly_dhan_preflight.py"
      - "tests/test_dhan_edge_volume_diagnostic.py"
      - "tests/test_iwf_math.py"
      - "tests/test_nifty50_weight_source.py"
      - ".github/workflows/bup01-c1-offline-tests.yml"
  pull_request:
    branches:
      - phase/constituent-weekly-outcomes-c0
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bup01-c1-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected C1 code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt pytest
      - name: Run Dhan auth, expiry-scope, membership and source regressions
        run: |
          python -m pytest -q \
            tests/test_dhan_token_refresh_script.py \
            tests/test_constituent_weekly_dhan_preflight.py \
            tests/test_dhan_edge_volume_diagnostic.py \
            tests/test_iwf_math.py \
            tests/test_nifty50_weight_source.py \
            tests/test_bup01_membership_intervals.py
