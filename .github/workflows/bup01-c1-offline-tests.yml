name: BUP-01 C1 offline data and auth regression tests

on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "research/constituent_weekly/RESEARCH_PLAN.md"
      - "research/constituent_weekly/STATUS.md"
      - "scripts/constituent_weekly/validate_plan.py"
      - "tests/test_constituent_weekly_plan.py"
      - "scripts/constituent_weekly/audit_c1_continuous_dhan_coverage.py"
      - "tests/test_c1_continuous_dhan_coverage.py"
      - "data/constituent_weekly/security_alias_history.csv"
      - "data/constituent_weekly/security_corporate_action_events.csv"
      - "scripts/constituent_weekly/security_identity.py"
      - "tests/test_c1_security_alias_history.py"
      - "scripts/constituent_weekly/audit_c1_daily_history.py"
      - "tests/test_c1_daily_history.py"
      - ".github/workflows/bup01-c1-offline-tests.yml"
  pull_request:
    branches:
      - phase/constituent-weekly-outcomes-c0
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bup01-c1-offline-checks
  cancel-in-progress: false

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected C1 code
        uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r live_api/requirements.txt pytest
      - name: Run Dhan auth, membership and v1.3 research-plan regressions
        run: |
          python -m pytest -q \
            tests/test_dhan_token_refresh_script.py \
            tests/test_constituent_weekly_dhan_preflight.py \
            tests/test_dhan_edge_volume_diagnostic.py \
            tests/test_bup01_membership_intervals.py \
            tests/test_constituent_weekly_plan.py \
            tests/test_c1_continuous_dhan_coverage.py \
            tests/test_c1_security_alias_history.py
