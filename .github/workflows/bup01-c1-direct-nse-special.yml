name: BUP-01 C1 direct NSE special-session archive check
on:
  push:
    branches:
      - phase/constituent-weekly-outcomes-c1-data
    paths:
      - "scripts/constituent_weekly/audit_c1_direct_nse_special.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bup01-c1-direct-nse-special
  cancel-in-progress: false
jobs:
  direct-nse-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/constituent-weekly-outcomes-c1-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install -r requirements.txt -r live_api/requirements.txt cryptography huggingface_hub pyarrow
      - name: Restore encrypted research cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.run_id }}
          restore-keys: |
            bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-
      - name: Fetch, validate and encrypt exact NSE archives
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEJHQ_ENCRYPTED_CACHE_DIR: ${{ runner.temp }}/bup01-tejhq-encrypted
        run: python scripts/constituent_weekly/audit_c1_direct_nse_special.py --root . --run-id "$GITHUB_RUN_ID"
      - name: Save encrypted research cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bup01-tejhq-encrypted
          key: bup01-tejhq-raw-nse-encrypted-${{ runner.os }}-f576704883fff86a6facdcde336db6ce19502063-${{ github.run_id }}
      - name: Publish audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/constituent_weekly/C1_DIRECT_NSE_SPECIAL_SESSION_AUDIT.json research/constituent_weekly/C1_DIRECT_NSE_SPECIAL_SESSION_AUDIT.md
          git add README.md research/constituent_weekly/STATUS.md logs/RESEARCH_LOG.md logs/CONVERSATION_LOG.md
          git commit -m "Record direct NSE special-session bhavcopy audit" || exit 0
          git push origin HEAD:phase/constituent-weekly-outcomes-c1-data
