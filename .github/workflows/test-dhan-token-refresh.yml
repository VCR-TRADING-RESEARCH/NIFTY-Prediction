name: Dhan token refresh regression

on:
  push:
    branches:
      - "fix/dhan-token-refresh-post"
    paths:
      - "scripts/refresh_dhan_token.py"
      - "tests/test_dhan_token_refresh_script.py"
      - ".github/workflows/test-dhan-token-refresh.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-refresh-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install pytest requests pyotp
      - name: Run token refresh regression tests
        run: python -m pytest -q tests/test_dhan_token_refresh_script.py
