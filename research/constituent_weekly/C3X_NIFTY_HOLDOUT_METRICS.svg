<title id="title">C3-X exploratory NIFTY holdout metrics</title>
<desc id="desc">Meta-model accuracy 50.98 percent, balanced accuracy 53.45 percent, ROC-AUC 48.68 percent; breadth and lag benchmarks are lower on these measures.</desc>
