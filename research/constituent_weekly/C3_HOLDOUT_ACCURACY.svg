<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">C3 stock direction holdout accuracy</title>
<desc id="desc">Momentum 50.52 percent, symbol frequency 45.92 percent, logistic regression 48.12 percent, ExtraTrees 48.51 percent, HistGradientBoosting 46.69 percent.</desc>
<rect width="900" height="470" fill="#ffffff"/>
